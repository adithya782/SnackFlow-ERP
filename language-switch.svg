
<svg xmlns="http://www.w3.org/2000/svg"
     width="240" height="54" viewBox="0 0 240 54">

  <rect x="2" y="2" width="236" height="50" rx="25"
        fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <rect x="6" y="6" width="114" height="42" rx="21"
        fill="#238636">
    <animate attributeName="x"
             values="6;6;120;120;6"
             keyTimes="0;0.35;0.5;0.85;1"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>

  <text x="63" y="27"
        font-family="Arial, sans-serif"
        font-size="15" font-weight="600"
        text-anchor="middle" dominant-baseline="central"
        fill="#ffffff">
    English
    <animate attributeName="fill"
             values="#ffffff;#ffffff;#8b949e;#8b949e;#ffffff"
             keyTimes="0;0.35;0.5;0.85;1"
             dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="177" y="27"
        font-family="Arial, sans-serif"
        font-size="15" font-weight="600"
        text-anchor="middle" dominant-baseline="central"
        fill="#8b949e">
    தமிழ்
    <animate attributeName="fill"
             values="#8b949e;#8b949e;#ffffff;#ffffff;#8b949e"
             keyTimes="0;0.35;0.5;0.85;1"
             dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
